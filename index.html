<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>محاكاة TikTok Coins</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; color: #fff;
      background: radial-gradient(circle at top, #25304b, #090b13 65%);
    }
    .card {
      width: min(100%, 420px); padding: 28px; border-radius: 22px;
      background: #151927; border: 1px solid #343b52;
      box-shadow: 0 18px 55px #0008;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .sub { text-align: center; color: #b9c2d8; margin: 0 0 24px; }
    label { display: block; margin: 16px 0 8px; color: #e8ecf7; }
    input, select, button {
      width: 100%; padding: 14px; border-radius: 12px; font-size: 16px;
    }
    input, select { color: white; background: #0d1120; border: 1px solid #48516c; }
    button {
      margin-top: 20px; border: 0; color: #071018; font-weight: bold;
      background: linear-gradient(90deg, #25f4ee, #fe2c55); cursor: pointer;
    }
    #result { min-height: 48px; text-align: center; line-height: 1.7; margin: 18px 0 0; }
    .notice {
      margin-top: 20px; padding: 12px; border-radius: 12px;
      background: #29233a; color: #ffd9a8; text-align: center;
      font-size: 13px; line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎁 TikTok Coins</h1>
    <p class="sub">تجربة توضيحية فقط</p>

    <label for="username">اسم المستخدم التجريبي</label>
    <input id="username" type="text" placeholder="اكتب اسمًا تجريبيًا" autocomplete="off">

    <label for="amount">اختر كمية العملات للعرض</label>
    <select id="amount">
      <option value="100">100 عملة</option>
      <option value="500">500 عملة</option>
      <option value="1000">1000 عملة</option>
      <option value="10000">10000 عملة</option>
    </select>

    <button id="demoButton" type="button">جرّب المحاكاة</button>
    <p id="result" aria-live="polite"></p>

    <div class="notice">
      تنبيه: هذه صفحة تجريبية غير تابعة لـ TikTok.
      لا يتم إرسال أو شحن أي عملات حقيقية، ولا تطلب كلمة مرور أو بيانات دفع.
    </div>
  </main>

  <script>
    const button = document.getElementById('demoButton');
    button.addEventListener('click', () => {
      const username = document.getElementById('username').value.trim();
      const amount = document.getElementById('amount').value;
      const result = document.getElementById('result');

      if (!username) {
        result.textContent = 'من فضلك اكتب اسمًا تجريبيًا أولًا.';
        return;
      }
      result.textContent = `اكتملت المحاكاة للاسم ${username} والكمية ${amount} — لم يتم إرسال أي عملات حقيقية.`;
    });
  </script>
</body>
</html>
